name: ci

on:
  push:
  pull_request:
  schedule:
    - cron: "17 5 * * 1"  # weekly: new CVEs in pinned dependencies

permissions:
  contents: read

# Third-party actions are pinned by commit SHA (tag in comment).
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (hash-verified)
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --require-hashes -r requirements-build.lock
          python -m pip install --no-deps --no-build-isolation .
      - run: ruff check src tests scripts
      - run: bandit -q -r src -ll
      - run: pytest
      - name: Read-only gate (no write tool published in read mode)
        run: pytest tests/test_registry.py

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Known vulnerabilities
        run: |
          for lock in requirements.lock requirements-dev.lock requirements-build.lock; do
            pip-audit -r "$lock" --require-hashes --disable-pip
          done
      - name: SBOM (CycloneDX, runtime dependencies)
        run: cyclonedx-py requirements requirements.lock -o sbom.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json

  image:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -t f5xc-waap-mcp:ci .
      - name: Image runs as non-root, without build tooling
        run: |
          docker run --rm --entrypoint python f5xc-waap-mcp:ci -c \
            "import os, importlib.util as u; assert os.getuid() == 65532; assert u.find_spec('hatchling') is None"
      - name: Image starts on a read-only filesystem without capabilities
        run: |
          docker run -d --name smoke --read-only --cap-drop=ALL --security-opt no-new-privileges \
            -e F5XC_TENANT=ci -e F5XC_ALLOWED_NAMESPACES=prod f5xc-waap-mcp:ci
          for i in $(seq 1 30); do
            docker logs smoke 2>&1 | grep -q 'Application startup complete' && break
            sleep 1
          done
          docker logs smoke 2>&1 | grep -q '"event": "startup"'
          docker logs smoke 2>&1 | grep -q 'Application startup complete'
          docker rm -f smoke
      - name: Tenant check command is available in the image
        run: |
          docker run --rm --network none -e F5XC_TENANT=ci -e F5XC_ALLOWED_NAMESPACES=prod \
            -e F5XC_API_TOKEN=DummyTokenForCiOnly-0000 f5xc-waap-mcp:ci check | grep -q '"ok": false'
